<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arielatra · Hero</title>
    <!-- Fichier CSS séparé (assets/style-accueil.css) -->
    <link rel="stylesheet" href="assets/style-accueil.css">
</head>

<body>

    <!-- ========== HERO SECTION ========== -->
    <section class="hero">
        <div class="container hero-container">
            <span class="hero-badge">✨ Nouveau</span>
            <h1 class="hero-title">Bienvenue dans <span class="highlight">Arielatra</span></h1>
            <p class="hero-subtitle">
                L'expérience numérique qui réinvente votre quotidien.
                <br>Simple, élégante, et pensée pour vous.
            </p>
            <div class="hero-actions">
                <a href="#" class="btn btn-primary">Commencer</a>
                <a href="#" class="btn btn-outline">En savoir plus</a>
            </div>
            <div class="hero-stats">
                <div class="stat-item">
                    <span class="stat-number">12k+</span>
                    <span class="stat-label">utilisateurs</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">4.9</span>
                    <span class="stat-label">étoiles</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">24/7</span>
                    <span class="stat-label">support</span>
                </div>
            </div>
        </div>
    </section>


</body>

</html>
